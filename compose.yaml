services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      CONFIG_PATH: /app/config/config.json
      DATA_DIR: /app/data
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bot-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    stop_grace_period: 5m
    healthcheck:
      test: [CMD, node, src/cli.js, health]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  bot-data:
